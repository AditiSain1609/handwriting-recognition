<!DOCTYPE html>
<html>

<head>
    <title>Handwriting Recognition (A-Z)</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            margin: auto;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        }

        h4 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .rules {
            text-align: left;
            font-size: 14px;
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Upload section spacing */
        .upload-section input {
            margin: 10px 0;
        }

        /* Button styling */
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 12px;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* Preview + result side by side */
        .preview-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        img {
            width: 150px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        /* Result box */
        .result {
            font-size: 26px;
            font-weight: bold;
            background: #e8f5e9;
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 120px;
        }

        /* Sample images */
        .samples img {
            width: 60px;
            margin: 5px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .samples img:hover {
            border: 2px solid green;
        }

        /* 🔥 Loader */
        .loader {
            display: none;
            margin-top: 15px;
        }

        .loader div {
            width: 10px;
            height: 10px;
            margin: 3px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .loader div:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loader div:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Handwriting Recognition (A-Z)</h2>

        <!-- RULES -->
        <div class="rules">
            <b> Image Upload Rules :-</b><br>
            . Use JPG / PNG image<br>
            . Background should be white<br>
            . Use black pen or marker<br>
            . Keep letter centered<br>
            . Upload only ONE capital letter (A-Z)<br>
            . Avoid blur or noise
        </div>

        <!-- Upload -->
        <div class="upload-section">
            <h4>Upload Image :-</h4>

            <form id="upload-form">
                <input type="file" id="file" name="file">
                <br>
                <button type="submit">Predict</button>
            </form>
        </div>

        <!-- Preview + Result -->
        <div class="preview-section">
            <img id="preview" style="display:none;">
            <div class="result" id="result"></div>
        </div>

        <!-- 🔥 Loader -->
        <div class="loader" id="loader">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <!-- Samples -->
        <h4>Try Sample Images :-</h4>
        <div class="samples">
            <img src="/static/sample_A.png" onclick="useSample(this)">
            <img src="/static/sample_B.png" onclick="useSample(this)">
            <img src="/static/sample_C.png" onclick="useSample(this)">
            <img src="/static/sample_L.png" onclick="useSample(this)">
        </div>
    </div>

    <script>
        let selectedFile = null;

        // Upload preview
        document.getElementById("file").addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
                selectedFile = file;

                const preview = document.getElementById("preview");
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";

                document.getElementById("result").innerText = "";
            }
        });

        // Sample click
        function useSample(imgElement) {
            fetch(imgElement.src)
                .then(res => res.blob())
                .then(blob => {
                    selectedFile = new File([blob], "sample.png");

                    const preview = document.getElementById("preview");
                    preview.src = URL.createObjectURL(selectedFile);
                    preview.style.display = "block";

                    document.getElementById("result").innerText = "";
                });
        }

        // Predict
        document.getElementById("upload-form").addEventListener("submit", function (e) {
            e.preventDefault();

            if (!selectedFile) {
                alert("Please upload or select a sample image");
                return;
            }

            // 🔥 show loader
            document.getElementById("loader").style.display = "block";
            document.getElementById("result").innerText = "";

            const formData = new FormData();
            formData.append("file", selectedFile);

            fetch("/predict", {
                method: "POST",
                body: formData
            })
                .then(res => res.text())
                .then(data => {
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("result").innerText = data;
                });
        });
    </script>

</body>

</html>
